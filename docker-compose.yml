version: '3.7'

volumes:
    logs:
        driver: local
    mysql_data:
        driver: local

services:
    slim:
        image: php:8.2-cli-alpine
        working_dir: /var/www
        command: php -S 0.0.0.0:8080 -t public
        environment:
            docker: "true"
            APP_ENV: development
            DB_HOST: mysql
            DB_PORT: 3306
            DB_NAME: slim_app
            DB_USER: slim
            DB_PASS: slim_secret
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www
            - logs:/var/www/logs
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: slim_app
            MYSQL_USER: slim
            MYSQL_PASSWORD: slim_secret
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10
